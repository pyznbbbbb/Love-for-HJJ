<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写给黄晶晶 ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:linear-gradient(135deg,#fff0f5,#ffe4ec,#ffd6e5);
  color:#6b2945;
}
.scene{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;width:55vw;height:55vw;max-width:650px;max-height:650px;border-radius:50%;
 background:rgba(255,255,255,.45);filter:blur(55px);animation:pulse 5s ease-in-out infinite}
.card{
 position:relative;z-index:2;width:min(88%,560px);padding:48px 34px 42px;
 text-align:center;border:1px solid rgba(255,255,255,.8);
 background:rgba(255,255,255,.55);backdrop-filter:blur(18px);
 border-radius:30px;box-shadow:0 25px 80px rgba(137,45,83,.18);
 animation:appear 1.2s ease both;
}
.heart{font-size:62px;animation:beat 1.4s infinite;filter:drop-shadow(0 8px 12px rgba(220,65,110,.25))}
.small{margin-top:8px;letter-spacing:5px;font-size:13px;color:#a45b76}
h1{font-size:clamp(32px,8vw,54px);margin:15px 0 14px;color:#9d3158}
h1 span{display:inline-block;animation:shine 3s infinite}
.subtitle{font-size:17px;line-height:2;color:#78445a}
.message{
 margin:26px auto 24px;max-width:430px;font-size:18px;line-height:2.1;
 color:#693247;min-height:115px;
}
.btn{
 border:0;cursor:pointer;padding:14px 32px;border-radius:999px;
 font-size:16px;color:white;background:linear-gradient(135deg,#e85c86,#c93e6c);
 box-shadow:0 10px 25px rgba(201,62,108,.25);transition:.25s;
}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 32px rgba(201,62,108,.32)}
.note{margin-top:18px;font-size:12px;color:#ad7288}
.heart-float{position:absolute;bottom:-40px;opacity:.65;animation:float linear infinite;z-index:1}
.petal{position:absolute;top:-30px;width:12px;height:18px;background:#f6a7bf;border-radius:100% 0 100% 0;opacity:.65;animation:fall linear infinite}
#yesMessage{display:none;margin-top:22px;font-size:22px;font-weight:bold;color:#c53668;animation:appear .8s ease both}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.13)}30%{transform:scale(1)}}
@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(.95);opacity:.6}50%{transform:scale(1.08);opacity:.9}}
@keyframes shine{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 22px rgba(255,130,170,.7)}}
@keyframes float{0%{transform:translateY(0) rotate(0deg);opacity:0}15%{opacity:.65}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}
@media(max-width:500px){.card{padding:38px 23px}.message{font-size:16px}.heart{font-size:52px}}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div id="petals"></div>
  <div id="hearts"></div>

  <main class="card">
    <div class="heart">❤️</div>
    <div class="small">A LITTLE MESSAGE FOR</div>
    <h1><span>黄晶晶</span></h1>
    <p class="subtitle">有些话，我想认真地告诉你。</p>

    <div class="message" id="message">
      遇见你以后，我发现平凡的日子也会偷偷发光。<br>
      我不知道未来会发生什么，<br>
      但我想把未来的一部分，留给你。
    </div>

    <button class="btn" id="btn">点这里 ❤️</button>
    <div id="yesMessage">黄晶晶，我喜欢你。可以给我一个机会吗？💗</div>
    <div class="note">—— 这封信，只写给你</div>
  </main>
</div>

<script>
const messages=[
  "遇见你以后，我发现平凡的日子也会偷偷发光。<br>我不知道未来会发生什么，<br>但我想把未来的一部分，留给你。",
  "如果喜欢有声音，<br>那一定是我每次看到你名字时，<br>心里轻轻响起的那一声“喜欢”。",
  "我想和你一起看很多次日落，<br>也想和你分享很多个普通的瞬间。<br>因为是你，普通也会变得特别。"
];
let index=0;
const message=document.getElementById("message");
const btn=document.getElementById("btn");
const yes=document.getElementById("yesMessage");

btn.addEventListener("click",()=>{
  index++;
  if(index<messages.length){
    message.style.opacity=0;
    setTimeout(()=>{message.innerHTML=messages[index];message.style.opacity=1},250);
    btn.textContent=index===messages.length-1?"最后一句 ❤️":"再听我说一句";
  }else{
    yes.style.display="block";
    btn.textContent="❤️ 黄晶晶 ❤️";
    createBurst();
  }
});

function createHearts(){
  const box=document.getElementById("hearts");
  for(let i=0;i<16;i++){
    const h=document.createElement("div");
    h.className="heart-float";
    h.textContent=["♥","♡","❤"][Math.floor(Math.random()*3)];
    h.style.left=Math.random()*100+"%";
    h.style.fontSize=(14+Math.random()*22)+"px";
    h.style.animationDuration=(6+Math.random()*7)+"s";
    h.style.animationDelay=(-Math.random()*10)+"s";
    box.appendChild(h);
  }
}
function createPetals(){
  const box=document.getElementById("petals");
  for(let i=0;i<22;i++){
    const p=document.createElement("div");
    p.className="petal";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(6+Math.random()*8)+"s";
    p.style.animationDelay=(-Math.random()*10)+"s";
    p.style.transform="scale("+(0.5+Math.random())+")";
    box.appendChild(p);
  }
}
function createBurst(){
  for(let i=0;i<28;i++){
    const h=document.createElement("div");
    h.textContent="❤️";
    h.style.position="fixed";
    h.style.left="50%";h.style.top="50%";h.style.zIndex=10;
    h.style.fontSize=(14+Math.random()*22)+"px";
    h.style.pointerEvents="none";
    document.body.appendChild(h);
    const angle=Math.random()*Math.PI*2, dist=120+Math.random()*300;
    h.animate([
      {transform:"translate(-50%,-50%) scale(.5)",opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(angle)*dist}px),calc(-50% + ${Math.sin(angle)*dist}px)) scale(1.2)`,opacity:0}
    ],{duration:1100+Math.random()*600,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=()=>h.remove();
  }
}
createHearts();createPetals();
</script>
</body>
</html>
